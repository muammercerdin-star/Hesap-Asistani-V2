name: Build Hesap Asistani V3 APK

on:
  workflow_dispatch:
  push:
    paths:
      - "hesap_v3.html"
      - "android_v3/**"
      - ".github/workflows/build-hesap-v3-apk.yml"
      - "settings.gradle"
      - "build.gradle"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle :android_v3:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hesap-Asistani-V3-debug-apk
          path: android_v3/build/outputs/apk/debug/android_v3-debug.apk
